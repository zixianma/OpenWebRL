   <g id="text_13">
    <text style="font: 15px 'Albert Sans'; text-anchor: start" x="45.129688" y="12.6" transform="rotate(-0 45.129688 12.6)">Performance vs. browser commands</text>
   </g>
  </g>
  <g id="text_14">
   <text style="fill: #5a6470; font: 7.3px 'Albert Sans'" transform="translate(45.129688 347.0144)">OM2W only · same 111 fresh tasks valid in all eight cells; valid failures included. All four native methods: 300 outcomes each; collection complete.</text>
   <text style="fill: #5a6470; font: 7.3px 'Albert Sans'" transform="translate(45.129688 357.8184)">Native: 20,000 tokens / 100 decisions; BrowserCode: 12,288 / 30. Different collection dates and timing scopes; descriptive comparison. External judging excluded.</text>
   <text style="fill: #5a6470; font: 7.3px 'Albert Sans'" transform="translate(45.129688 367.688)">One execution: a selected BrowserCode block or native browser-command log entry; either can contain several actions. This compares harness-level command volume, not standardized actions.</text>
   <text style="fill: #5a6470; font: 7.3px 'Albert Sans'" transform="translate(45.129688 378.492)">Cost: native per-task all-attempt model charges, helpers and full unknown reserves; BrowserCode original proposal/selector receipts. Tables are reported separately.</text>
  </g>
  <g id="legend_1">
   <g id="text_15">
    <text style="font: 11px 'Albert Sans'; text-anchor: start" x="542.649688" y="33.088" transform="rotate(-0 542.649688 33.088)">Method (all high)</text>
   </g>
