  <g id="text_19">
   <text style="fill: #423c54; font: 6.5px 'Albert Sans'" transform="translate(4.176 241.528)">Heads trained on Piotr's GPT-5.5 panels (every panel unless noted), seed 0. Values: success (gain over SFT 4B, pp).</text>
   <text style="fill: #423c54; font: 6.5px 'Albert Sans'" transform="translate(4.176 249.068)">Bars: paired 95% bootstrap of the gain, drawn around the head's rate. Online-Mind2Web 300 (gpt-5.6-terra),</text>
   <text style="fill: #423c54; font: 6.5px 'Albert Sans'" transform="translate(4.176 256.608)">WebVoyager 595, DeepShop 150 (GPT-4o), equal weight. Heads 10-23/24, SFT 4B 10-18 (DeepShop drifts).</text>
  </g>
