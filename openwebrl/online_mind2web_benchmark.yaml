# Paper A.6/B: one standalone actor, o4-mini/AgentTrek, stochastic decoding.
# The isolated launcher selects Browser Use stealth; this does not change training.
eval:
  defaults:
    n_samples_per_eval_prompt: 1
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    max_response_len: 4096
  datasets:
    - name: online-mind2web-benchmark
      path: online_mind2web_monitor.jsonl
      input_key: prompt
      metadata_key: metadata
      custom_generate_function_path: openwebrl.eval_benchmark.generate
